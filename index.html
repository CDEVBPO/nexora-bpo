<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora BPO | Operations</title><style>
:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#e9eef8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#111d30;border-bottom:1px solid #283951;gap:12px}header strong{font-size:22px;color:#fff}small,.muted{color:#9db0c9}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}aside{padding:16px;background:#101b2b;border-right:1px solid #283951}nav button{display:block;width:100%;border:0;background:transparent;color:#afc2da;text-align:left;padding:12px;border-radius:9px;margin:3px 0}nav button.active,nav button:hover{background:#203b61;color:#fff}main{padding:26px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:20px 0}.card,.panel{background:#142238;border:1px solid #293b56;border-radius:14px;padding:19px}.card b{display:block;font-size:30px;margin-top:10px}.panel{margin:18px 0;overflow:auto}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 16px}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:#4e8df5;color:white;border:0;border-radius:8px;padding:11px 16px}button.secondary{background:#253a58;color:#fff;border:1px solid #3b5474;border-radius:8px;padding:9px 12px}button.danger{background:#512d39;color:#ffd8dc;border:1px solid #854454;border-radius:8px;padding:8px 10px}table{width:100%;border-collapse:collapse;min-width:700px}td,th{text-align:left;padding:12px;border-bottom:1px solid #2a3c55;font-size:14px}th{color:#a6bad3}td button{margin-right:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}input,select,textarea{background:#0e1b2d;border:1px solid #39506d;color:white;border-radius:8px;padding:11px;width:100%}textarea{min-height:100px}label{display:block;color:#bed0e5;font-size:13px;margin:11px 0 5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#294463;color:#dceaff;font-size:12px}.empty{padding:26px;text-align:center;color:#9eb3ce}dialog{border:1px solid #426080;background:#15253b;color:#fff;border-radius:15px;width:min(680px,94vw);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.notice{background:#193b39;border:1px solid #32766a;border-radius:10px;padding:12px;margin:15px 0;color:#c9f4e7}.bar{background:#253a56;border-radius:20px;height:10px;overflow:hidden}.bar>span{display:block;height:100%;background:#62a1ff}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}@media(max-width:720px){.shell{display:block}aside{padding:8px;overflow:auto}nav{display:flex;min-width:max-content}nav button{width:auto}main{padding:16px}header{padding:12px}header strong{font-size:18px}}
</style></head><body><header><div><strong>◈ Nexora BPO</strong> <small>Operations Suite · v3.0</small></div><small>Mobile + desktop · Offline / Cloud · ZAR</small></header><div class="shell"><aside><nav id="nav"></nav><div class="muted" style="padding:15px;font-size:12px">Local mode works offline. Cloud mode requires your own Supabase project. Back up regularly. Do not enter sensitive production data before security review.</div></aside><main id="main"></main></div><dialog id="modal"><h2 id="modalTitle"></h2><form id="editForm"><div id="formFields"></div><div class="actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button class="primary" type="submit">Save record</button></div></form></dialog><script>
'use strict';const KEY='nexora_bpo_v2',types={leads:{title:'Leads & Pipeline',fields:{company:'Company',contact:'Contact name',email:'Email',phone:'Phone',source:'Lead source',service:'Service required',stage:['New','Contacted','Qualified','Proposal','Negotiation','Won','Lost'],value:'Estimated deal value (ZAR)',next:'Next follow-up date',notes:'Notes'}},clients:{title:'Clients',fields:{company:'Company',contact:'Primary contact',email:'Email',phone:'Phone',service:'Services',status:['Active','Onboarding','Paused','Closed'],rate:'Monthly contract value (ZAR)',start:'Start date',notes:'Notes'}},contacts:{title:'Contacts',fields:{name:'Full name',company:'Company',role:'Role',email:'Email',phone:'Phone',notes:'Notes'}},tickets:{title:'Support Tickets',fields:{subject:'Subject',client:'Client',requester:'Requester',channel:['Email','Phone','Chat','Social','Other'],priority:['Low','Medium','High','Urgent'],status:['Open','In Progress','Waiting','Resolved','Closed'],due:'Due date',details:'Description / resolution'}},tasks:{title:'Tasks',fields:{title:'Task',client:'Client / project',priority:['Low','Medium','High','Urgent'],status:['To Do','In Progress','Blocked','Done'],due:'Due date',details:'Notes'}},projects:{title:'Projects & Campaigns',fields:{name:'Project / campaign',client:'Client',service:['Customer Support','Lead Generation','Sales','Virtual Assistant','Data Entry','Back Office','Appointment Setting','Other'],status:['Planned','Active','On Hold','Completed'],target:'Target / KPI',start:'Start date',end:'End date',notes:'Instructions'}},calls:{title:'Call & Interaction Log',fields:{date:'Date',client:'Client / prospect',person:'Person',channel:['Call','Email','Chat','WhatsApp','Meeting','Other'],direction:['Inbound','Outbound'],outcome:'Outcome',duration:'Duration (minutes)',notes:'Notes'}},invoices:{title:'Invoices & Payments',fields:{number:'Invoice number',client:'Client',issued:'Issue date',due:'Due date',amount:'Amount (ZAR)',status:['Draft','Sent','Part Paid','Paid','Overdue','Cancelled'],notes:'Description / payment reference'}},knowledge:{title:'Knowledge Base & Scripts',fields:{title:'Article / script name',category:['Call Script','Email Template','Process','FAQ','Training','Other'],service:'Service',content:'Content / steps'}}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}for(const k of Object.keys(types))if(!Array.isArray(db[k]))db[k]=[];db.settings ||= {business:'Nexora BPO',currency:'ZAR',monthlyTarget:'0'};let page='dashboard',query='';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));scheduleSync()}catch(e){alert('Could not save. Browser storage may be full. Export your data.')}}function money(n){return 'R '+(Number(n)||0).toLocaleString('en-ZA',{maximumFractionDigits:2})}function nav(){const items=[['dashboard','▦ Dashboard'],...Object.entries(types).map(([k,v])=>[k,'• '+v.title]),['reports','▤ Reports'],['cloud','☁ Cloud & Login'],['settings','⚙ Settings & Backup']];$('nav').innerHTML=items.map(([k,v])=>`<button class="${page===k?'active':''}" data-page="${k}">${esc(v)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()})}function header(title,extra=''){return `<div class="top"><h1>${esc(title)}</h1>${extra}</div>`}function dashboard(){const open=db.tickets.filter(x=>!['Closed','Resolved'].includes(x.status)).length,active=db.clients.filter(x=>x.status==='Active').length,pipeline=db.leads.filter(x=>!['Lost','Won'].includes(x.stage)).reduce((a,x)=>a+(+x.value||0),0),paid=db.invoices.filter(x=>x.status==='Paid').reduce((a,x)=>a+(+x.amount||0),0),pending=db.tasks.filter(x=>x.status!=='Done').length;let metrics=[['Active clients',active],['Open tickets',open],['Pending tasks',pending],['Pipeline value',money(pipeline)],['Paid invoices',money(paid)],['Total leads',db.leads.length]];let upcoming=[...db.tasks.filter(x=>x.due&&x.status!=='Done').map(x=>({name:x.title,date:x.due,kind:'Task'})),...db.leads.filter(x=>x.next&&!['Lost','Won'].includes(x.stage)).map(x=>({name:x.company,date:x.next,kind:'Follow-up'})),...db.tickets.filter(x=>x.due&&!['Closed','Resolved'].includes(x.status)).map(x=>({name:x.subject,date:x.due,kind:'Ticket'}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);return header('Operations dashboard',`<button class="primary" onclick="edit('leads')">+ Add lead</button>`)+`<div class="notice">Welcome to Nexora BPO. Begin with a lead, convert it into a client, then track work, interactions, support and billing. Records stay on this device until you explicitly enable cloud sync.</div><div class="cards">${metrics.map(([a,b])=>`<div class="card"><small>${esc(a)}</small><b>${esc(b)}</b></div>`).join('')}</div><div class="grid2"><section class="panel"><h2>Upcoming work</h2>${upcoming.length?upcoming.map(x=>`<p><span class="pill">${esc(x.kind)}</span> ${esc(x.name)} <small>${esc(x.date)}</small></p>`).join(''):'<div class="empty">No upcoming items. Add a task or follow-up.</div>'}</section><section class="panel"><h2>Quick actions</h2><div class="toolbar">${[['leads','New lead'],['tickets','New ticket'],['tasks','New task'],['calls','Log interaction'],['invoices','New invoice'],['knowledge','Add script']].map(([k,n])=>`<button class="secondary" onclick="edit('${k}')">+ ${n}</button>`).join('')}</div></section></div>`}function listPage(k){const type=types[k],fields=Object.keys(type.fields),rows=db[k].filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(query.toLowerCase())));const cols=fields.slice(0,5);return header(type.title,`<button class="primary" onclick="edit('${k}')">+ New record</button>`)+`<div class="panel"><div class="toolbar"><input id="search" style="max-width:370px" placeholder="Search ${esc(type.title.toLowerCase())}..." value="${esc(query)}"><button class="secondary" onclick="exportCSV('${k}')">Export CSV</button>${k==='leads'?'<button class="secondary" onclick="importLeads()">Import leads CSV</button>':''}</div><p class="muted">${rows.length} record(s) · Edit records to update their status and details.</p><table><thead><tr>${cols.map(c=>`<th>${esc(Array.isArray(type.fields[c])?c:type.fields[c])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])||'—'}</td>`).join('')}<td><button class="secondary" onclick="edit('${k}','${r.id}')">Edit</button>${k==='leads'?`<button class="secondary" onclick="convertLead('${r.id}')">Convert</button>`:''}<button class="danger" onclick="removeRecord('${k}','${r.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}function edit(k,id){const t=types[k],r=db[k].find(x=>x.id===id)||{};$('modalTitle').textContent=(id?'Edit ':'New ')+t.title.replace(/s$/,'');$('formFields').innerHTML='<div class="fields">'+Object.entries(t.fields).map(([f,label])=>{let val=esc(r[f]??''),control=Array.isArray(label)?`<select name="${f}">${label.map(o=>`<option ${r[f]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f==='notes'||f==='details'||f==='content'?`<textarea name="${f}">${val}</textarea>`:`<input name="${f}" value="${val}" ${['date','due','next','issued','start','end'].includes(f)?'type="date"':''} ${['amount','value','rate','duration','target'].includes(f)&&f!=='target'?'type="number" step="0.01" min="0"':''}>`;return `<div><label>${esc(Array.isArray(label)?f[0].toUpperCase()+f.slice(1):label)}</label>${control}</div>`}).join('')+'</div>';$('editForm').onsubmit=e=>{e.preventDefault();const obj={...r,id:id||crypto.randomUUID(),...Object.fromEntries(new FormData(e.target))};if(id)db[k][db[k].findIndex(x=>x.id===id)]=obj;else db[k].push(obj);save();$('modal').close();render()};$('modal').showModal()}function removeRecord(k,id){if(confirm('Delete this record permanently?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}function convertLead(id){let r=db.leads.find(x=>x.id===id);if(!r)return;if(!confirm('Create a client record from this lead?'))return;db.clients.push({id:crypto.randomUUID(),company:r.company,contact:r.contact,email:r.email,phone:r.phone,service:r.service,status:'Onboarding',rate:r.value,notes:'Converted from lead. '+(r.notes||'')});r.stage='Won';save();page='clients';render()}function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function download(name,text,mime){const url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(k){let cols=Object.keys(types[k].fields),csv=[cols,...db[k].map(x=>cols.map(c=>x[c]??''))].map(row=>row.map(csvCell).join(',')).join('\r\n');download(`nexora_${k}.csv`,csv,'text/csv;charset=utf-8')}function backup(){download('nexora_bpo_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function restore(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{let v=JSON.parse(await input.files[0].text());if(!v||!Array.isArray(v.leads)||!Array.isArray(v.clients))throw Error('Invalid backup');if(!confirm('Replace ALL existing local data with this backup?'))return;db=v;for(const k of Object.keys(types))db[k] ||= [];db.settings ||= {};save();render();alert('Backup restored')}catch(e){alert('Could not restore: '+e.message)}};input.click()}function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}function importLeads(){let input=document.createElement('input');input.type='file';input.accept='.csv,text/csv';input.onchange=async()=>{try{let rows=parseCSV(await input.files[0].text()),heads=rows.shift().map(x=>x.trim().toLowerCase()),allowed=Object.keys(types.leads.fields);if(!heads.includes('company'))throw Error('CSV must have a company column.');let count=0;for(let row of rows){let r={id:crypto.randomUUID(),stage:'New'};heads.forEach((h,i)=>{if(allowed.includes(h))r[h]=row[i]||''});if(r.company?.trim()){db.leads.push(r);count++}}save();render();alert(`Imported ${count} leads`)}catch(e){alert(e.message)}};input.click()}function reports(){const countBy=(k,f)=>{let obj={};db[k].forEach(r=>obj[r[f]||'Unspecified']=(obj[r[f]||'Unspecified']||0)+1);return obj};let sections=[['Lead pipeline',countBy('leads','stage')],['Ticket status',countBy('tickets','status')],['Task status',countBy('tasks','status')],['Invoice status',countBy('invoices','status')]];return header('Reports & Performance')+`<div class="cards"><div class="card"><small>Total invoiced</small><b>${money(db.invoices.reduce((s,x)=>s+(+x.amount||0),0))}</b></div><div class="card"><small>Paid revenue recorded</small><b>${money(db.invoices.filter(x=>x.status==='Paid').reduce((s,x)=>s+(+x.amount||0),0))}</b></div><div class="card"><small>Won leads</small><b>${db.leads.filter(x=>x.stage==='Won').length}</b></div><div class="card"><small>Resolved tickets</small><b>${db.tickets.filter(x=>['Resolved','Closed'].includes(x.status)).length}</b></div></div><div class="grid2">${sections.map(([name,values])=>{let max=Math.max(1,...Object.values(values));return `<section class="panel"><h2>${name}</h2>${Object.entries(values).length?Object.entries(values).map(([n,v])=>`<p>${esc(n)} <b style="float:right">${v}</b></p><div class="bar"><span style="width:${v/max*100}%"></span></div>`).join(''):'<div class="empty">No data yet</div>'}</section>`}).join('')}</div>`}function settings(){return header('Settings & Data Backup')+`<div class="panel"><h2>Business details</h2><label>Business name</label><input id="business" value="${esc(db.settings.business||'Nexora BPO')}"><label>Monthly revenue target (ZAR)</label><input id="target" type="number" min="0" value="${esc(db.settings.monthlyTarget||'0')}"><div class="toolbar"><button class="primary" onclick="db.settings.business=$('business').value;db.settings.monthlyTarget=$('target').value;save();alert('Settings saved')">Save settings</button></div></div><div class="panel"><h2>Backups and portability</h2><p class="muted">Download a JSON backup after each workday. Importing a backup replaces existing data. CSV exports work per module.</p><div class="toolbar"><button class="primary" onclick="backup()">Download full backup (JSON)</button><button class="secondary" onclick="restore()">Restore from JSON</button></div></div><div class="panel"><h2>Security and limitations</h2><p>Local mode uses browser storage without a login. Cloud mode uses Supabase email/password authentication and row-level access controls after you deploy the supplied SQL. Cloud sync is single-user and last-write-wins, not collaborative editing. Browser clearing or device failure can cause data loss in local mode. Email delivery, telephony, lead enrichment, and automatic prospecting are not included. Do not store sensitive production customer records until your deployment and security controls have been reviewed.</p><button class="danger" onclick="if(confirm('Permanently erase all Nexora BPO data in this browser?')){localStorage.removeItem(KEY);location.reload()}">Erase local data</button></div>`}function render(){nav();$('main').innerHTML=page==='dashboard'?dashboard():types[page]?listPage(page):page==='reports'?reports():page==='cloud'?cloudPage():settings();const search=$('search');if(search){search.oninput=e=>{const start=e.target.selectionStart;query=e.target.value;const p=page;render();const s=$('search');if(page===p){s.focus();s.setSelectionRange(start,start)}}}}
const CONFIG_KEY='nexora_cloud_config_v3';let cloudConfig=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')||{url:'',key:''};let session=null,syncTimer=null,syncing=false,dirty=false;let connectionStatus='Not tested yet';let syncMessage='Cloud is not connected';
function baseUrl(){return (cloudConfig.url||'').replace(/\/+$/,'')}
function validConfig(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(baseUrl()) && cloudConfig.key.length>20}
async function api(path,method='GET',body=null,token=null){if(!validConfig())throw Error('Enter a valid Supabase project URL and publishable/anon key.');const headers={'apikey':cloudConfig.key,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;if(method==='POST'&&path.startsWith('/rest/v1/workspaces'))headers.Prefer='resolution=merge-duplicates,return=minimal';const response=await fetch(baseUrl()+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});const result=await response.text();let data;try{data=JSON.parse(result)}catch{data=result}if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||('HTTP '+response.status));return data}
async function signIn(){try{let email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!email||!password)throw Error('Email and password are required');let data=await api('/auth/v1/token?grant_type=password','POST',{email,password});session=data;sessionStorage.setItem('nexora_session',JSON.stringify(data));syncMessage='Signed in. Choose whether to download cloud data or upload your local data.';render()}catch(e){alert('Sign in failed: '+e.message)}}
async function signUp(){try{let email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(password.length<8)throw Error('Use at least 8 characters.');await api('/auth/v1/signup','POST',{email,password});alert('Account requested. Confirm your email if required, then sign in.')}catch(e){alert('Sign up failed: '+e.message)}}
function signOut(){session=null;sessionStorage.removeItem('nexora_session');syncMessage='Signed out. Local data remains on this device.';render()}
async function refreshSession(){if(!session?.refresh_token)return false;try{const data=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});session=data;sessionStorage.setItem('nexora_session',JSON.stringify(data));return true}catch{signOut();return false}}
async function authApi(path,method='GET',body=null){if(!session)throw Error('Sign in first');if(Date.now()/1000 > (session.expires_at||0)-60){if(!await refreshSession())throw Error('Session expired')}return api(path,method,body,session.access_token)}
async function getUser(){let data=await authApi('/auth/v1/user');if(!data?.id)throw Error('Could not verify account');return data}
async function cloudDownload(){try{let user=await getUser(),rows=await authApi('/rest/v1/workspaces?user_id=eq.'+encodeURIComponent(user.id)+'&select=data,updated_at');if(!rows.length){syncMessage='No cloud workspace yet. You may upload local data.';render();return}let incoming=rows[0].data;if(!incoming||!Array.isArray(incoming.leads)||!Array.isArray(incoming.clients))throw Error('Cloud data has an unexpected format');if(!confirm('Replace ALL local records with cloud records? Download a local backup first.'))return;db=incoming;for(let k of Object.keys(types))db[k] ||= [];db.settings ||= {};localStorage.setItem(KEY,JSON.stringify(db));dirty=false;syncMessage='Cloud data downloaded successfully';render()}catch(e){alert('Download failed: '+e.message)}}
async function cloudUpload(silent=false){if(!session)return;if(syncing){dirty=true;return}syncing=true;try{let user=await getUser();await authApi('/rest/v1/workspaces?on_conflict=user_id','POST',{user_id:user.id,data:db});syncMessage='Cloud synced at '+new Date().toLocaleTimeString();dirty=false;if(!silent)alert('Cloud upload complete')}catch(e){syncMessage='Sync error: '+e.message;if(!silent)alert(syncMessage)}finally{syncing=false;if(page==='cloud')render()}}
function scheduleSync(){if(!session||!cloudAutoSync)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudUpload(true),1500)}
let cloudAutoSync=localStorage.getItem('nexora_auto_sync_v3')==='yes';
function cloudPage(){return header('Cloud & Login')+`<div class="notice">Cloud mode is optional. You must create your own free Supabase project, run the included database SQL, and enter its public client key. Never paste a service_role or secret key here. This is a starter app, not an audited production deployment.</div><div class="panel"><h2>1. Connect your Supabase project</h2><label>Project URL (https://your-project.supabase.co)</label><input id="cloudUrl" autocomplete="off" value="${esc(cloudConfig.url)}"><label>Publishable / anon client key (not secret)</label><input id="cloudKey" autocomplete="off" value="${esc(cloudConfig.key)}"><div class="toolbar"><button type="button" class="primary" onclick="saveCloudConfig()">Save connection settings</button><button type="button" class="secondary" onclick="testCloudConfig()">Test connection</button></div><p id="connectionStatus" role="status" aria-live="polite" class="muted">${esc(connectionStatus)}</p></div><div class="panel"><h2>2. Your account</h2>${session?`<p class="notice">Signed in · ${esc(session.user?.email||'Account connected')}</p><button class="secondary" onclick="signOut()">Sign out</button>`:`<label>Email</label><input id="cloudEmail" type="email" autocomplete="username"><label>Password (8+ characters)</label><input id="cloudPassword" type="password" autocomplete="current-password"><div class="toolbar"><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div>`}</div><div class="panel"><h2>3. Sync your workspace</h2><p class="muted">${esc(syncMessage)}</p><p>Choose carefully: upload overwrites your cloud workspace, while download replaces local data. Export a JSON backup first. This single-user sync uses last-write-wins.</p><div class="toolbar"><button class="secondary" onclick="backup()">Back up local data</button><button class="primary" ${session?'':'disabled'} onclick="cloudUpload()">Upload local → cloud</button><button class="secondary" ${session?'':'disabled'} onclick="cloudDownload()">Download cloud → local</button></div><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:auto" ${cloudAutoSync?'checked':''} ${session?'':'disabled'} onchange="cloudAutoSync=this.checked;localStorage.setItem('nexora_auto_sync_v3',this.checked?'yes':'no')">Automatically upload after edits (single device recommended)</label></div><div class="panel"><h2>4. Publish online</h2><p>Host this index.html on a static web host such as Cloudflare Pages or GitHub Pages, using HTTPS. Then configure your Supabase Auth Site URL and redirect URLs to your actual hosted address. See SETUP.md in your ZIP file.</p></div>`}
function setConnectionStatus(message){connectionStatus=message;const el=$('connectionStatus');if(el)el.textContent=message}
function saveCloudConfig(){try{const url=$('cloudUrl').value.trim().replace(/\/+$/,''),key=$('cloudKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){setConnectionStatus('Invalid project URL. Use https://YOUR-PROJECT.supabase.co without /rest/v1/');return false}if(!key.startsWith('sb_publishable_')&&!key.startsWith('eyJ')){setConnectionStatus('Invalid client key. Copy the publishable key, not a secret key.');return false}cloudConfig={url,key};localStorage.setItem(CONFIG_KEY,JSON.stringify(cloudConfig));if(JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')?.key!==key)throw Error('Browser did not retain the key');syncMessage='Connection settings saved. Sign in to continue.';setConnectionStatus('Settings saved on this device. Tap Test connection to verify Supabase.');return true}catch(e){setConnectionStatus('Save failed: '+e.message+'. Check Chrome site storage permissions.');return false}}
